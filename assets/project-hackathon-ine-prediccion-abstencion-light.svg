<svg xmlns="http://www.w3.org/2000/svg" width="410" height="278" viewBox="0 0 410 278" role="img" aria-label="INE Abstention Forecast"><title>INE Abstention Forecast</title><style>@font-face{font-family:'Outfit';src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}
