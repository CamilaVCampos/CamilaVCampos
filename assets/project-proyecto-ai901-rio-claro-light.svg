<svg xmlns="http://www.w3.org/2000/svg" width="410" height="278" viewBox="0 0 410 278" role="img" aria-label="Río Claro AI Agents"><title>Río Claro AI Agents</title><style>@font-face{font-family:'Outfit';src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}
text{font-family:'Outfit','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.a{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
